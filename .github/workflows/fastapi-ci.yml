name: FastAPI CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/day14-fastapi]

permissions:
  contents: read

jobs:
  api-tests:
    name: FastAPI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r apps/api/requirements.lock

      - name: Verify dependencies
        run: python -m pip check

      - name: Validate Python syntax
        run: |
          python -m py_compile \
            apps/api/app/main.py \
            apps/api/app/logging_config.py \
            apps/api/tests/test_api.py

      - name: Run automated API tests
        run: python -m pytest apps/api/tests/test_api.py -v
